[package]
name = "bevy_ios_safearea"
version = "0.7.1"
edition = "2024"
license = "MIT"
authors = ["extrawurst <mail@rusticorn.com>"]
documentation = "https://docs.rs/bevy_ios_safearea"
repository = "https://github.com/rustunit/bevy_ios_safearea"
keywords = ["bevy", "gamedev", "mobile", "ios"]
description = "Bevy plugin to query device safe area insets"
# now that the crate sits at the repo root, keep repo-only files out of the package
# (`assets/` stays: the README image resolves from there)
exclude = [".github/", "justfile"]

[package.metadata.docs.rs]
targets = [
    # macOS
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    # iOS
    "aarch64-apple-ios",
]

[dependencies]
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bevy_math = { version = "0.19", default-features = false, features = ["std"] }
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_window = { version = "0.19", default-features = false }
bevy_log = { version = "0.19", default-features = false }
bevy_winit = { version = "0.19", default-features = false }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# Every feature `UIView`/`safeAreaInsets` is gated on has to be listed: this is our
# own copy of the crate now (winit is still on 0.2), so nothing arrives via feature
# unification. `objc2-core-foundation` carries `UIEdgeInsets`' `CGFloat` since 0.3.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "UIResponder",
    "UIView",
    "UIGeometry",
    "objc2-core-foundation",
] }

[dev-dependencies]
bevy = { version = "0.19", default-features = false }

[lints.rust]
missing_docs = "warn"
